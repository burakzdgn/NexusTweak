[package]
name = "nexus-tweak"
version = "1.0.0"
description = "Android ADB Optimization and Management Tool"
authors = ["NexusTweak Team"]
edition = "2021"

[lib]
name = "nexus_tweak_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-shell = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
anyhow = "1.0"
walkdir = "2.5"
log = "0.4"
env_logger = "0.11"
lazy_static = "1.4"
